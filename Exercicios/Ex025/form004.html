<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="name" id="iname" minlength="10">
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel-area-code" placeholder="(xx) xxxxxxxxx">
            </p>
        </fieldset>
        <p><input type="submit" value="ENVIAR"></p>
        <p><input type="reset" value="LIMPAR"></p>
    </form>
</body>
</html>
