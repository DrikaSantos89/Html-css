<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas com escopo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table {
            border-collapse: collapse;
        }

        th {
            background-color: gray;
        }
        

        th, td {
            border: 1px solid black;
            padding: 10px;
            
        }
    </style>
</head>

                <th rowspan="2">Notas Nota nota 21</td> <td>Nota 2</td></th>

            <td>7</td>

            <tr>
                <td>Física</td>

                <td>8</td>
            </tr>

            <tr>
                <td>Quimica</td>

                <td>9</td>
            </tr>

            <tr>
                <td>Biologia</td>

            </tr>

            <tr>

            </tr>

        </thead>
    </table>
</body>
</html>
