<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas com escopo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table {
            border-collapse: collapse;
        }

        th {
            background-color: rgb(187, 183, 183);
            color: white;
        }
        
        th, td {
            border: 1px solid black;
            padding: 10px; 
        }

        td.media {
            background-color: rgb(187, 183, 183);
            color: white;
        }

        th.area {
            background-color: white;
            color: black;
        }

        
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col">Area</th>
                <th scope="col">Disciplinas</th>
                <th rowspan="2" scope="rowgroup">Notas Nota 1</td> <td>Nota 2</td></th>
                <th scope="col">Média</th>
            </tr>
        
        </thead>

        <tbody>
            <th rowspan="4" scope="rowgroup" class="area">Exatas</th>
            <td>Matemática</td>
            <td>8</td>
            <td>7</td>
            <td>8</td>

            <tr>
                <td>Física</td>
                <td>8</td>
                <td>8</td>
                <td>8</td>
            </tr>

            <tr>
                <td>Quimica</td>
                <td>9</td>
                <td>9</td>
                <td>9</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>7</td>
                <td>8</td>
                <td>7</td>
            </tr>

            <tr>
                <td colspan="4" class="media">Média de Exatas</td>
                <td>9</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup" class="area">Humanas</th>
                <td>História</td>
                <td>6</td>
                <td>8</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Geografía</td>
                <td>8</td>
                <td>8</td>
                <td>8</td>
            </tr>

            <tr>
                <td colspan="4" class="media">Média de Humanas</td>
                <td>8</td>
            </tr>


        </tbody>
    </table>
</body>
</html>
